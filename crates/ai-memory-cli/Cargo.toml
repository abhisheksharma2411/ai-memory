[package]
name = "ai-memory-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "`ai-memory` binary entry point."

[[bin]]
name = "ai-memory"
path = "src/main.rs"

[dependencies]
ai-memory-consolidate.workspace = true
ai-memory-core.workspace = true
ai-memory-hooks.workspace = true
ai-memory-llm.workspace = true
ai-memory-mcp.workspace = true
ai-memory-store.workspace = true
ai-memory-web.workspace = true
ai-memory-workstream.workspace = true
ai-memory-wiki.workspace = true
reqwest.workspace = true
secrecy.workspace = true
sha2.workspace = true
base64.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
dirs.workspace = true
figment.workspace = true
flate2.workspace = true
fs2.workspace = true
# `transport-streamable-http-client-reqwest` pulls reqwest in with no TLS backend
# (`__reqwest = ["dep:reqwest"]` and nothing more), so the bridge could not reach an
# `https://` MCP server at all. rmcp's `reqwest` feature adds `reqwest?/rustls`, which
# on reqwest 0.13 is `rustls-platform-verifier` — the OS trust store, matching the
# behaviour the workspace client uses for every other outbound request (#492).
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
sysinfo.workspace = true
tar.workspace = true
jiff.workspace = true
jsonc-parser.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
